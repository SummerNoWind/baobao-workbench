<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>宝宝识字启蒙台</title>
<!-- 本工作台为本地单文件方案：数据存储于浏览器 localStorage，通过导出/导入 JSON 备份迁移 -->
<style>
:root{
  --c-main:#FF8A3D; --c-main-d:#F2650A; --c-sun:#FFC53D; --c-grass:#4CAF7D;
  --c-sky:#4A9BD8; --c-grape:#9B6DE3; --c-red:#E5484D; --c-ink:#3A3A3A;
  --c-bg:#FFF7EC; --c-card:#FFFFFF; --c-line:#FFE3C2;
  --r-lg:24px; --r-md:16px;
  --shadow:0 6px 20px rgba(255,138,61,.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  background:var(--c-bg); color:var(--c-ink);
  min-height:100vh; padding-bottom:calc(88px + env(safe-area-inset-bottom));
}
button{font-family:inherit;border:none;cursor:pointer;font-size:16px}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--c-ink)}
/* ===== 顶部 ===== */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,#FF9A4D,#FF6B3D);
  padding:14px 16px calc(14px + env(safe-area-inset-top));
  color:#fff;
  box-shadow:0 4px 16px rgba(242,101,10,.25);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand .t1{font-size:20px;font-weight:800;letter-spacing:1px}
.brand .t2{font-size:12px;opacity:.9;margin-top:2px}
.mode-switch{display:flex;background:rgba(255,255,255,.22);border-radius:999px;padding:4px;gap:4px}
.mode-switch button{
  min-width:64px;min-height:40px;border-radius:999px;font-weight:700;font-size:15px;
  background:transparent;color:#fff;padding:0 14px;
}
.mode-switch button.on{background:#fff;color:var(--c-main-d)}
.mode-switch button.off{opacity:.85}
.sync-note{
  margin-top:10px;background:rgba(255,255,255,.16);border-radius:12px;
  padding:8px 12px;font-size:12.5px;display:flex;align-items:center;gap:8px;
}
/* ===== 主容器 ===== */
.wrap{max-width:720px;margin:0 auto;padding:16px 14px}
/* ===== 今天要处理 ===== */
.today-card{
  background:var(--c-card);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:18px 16px;margin-bottom:16px;border:2px solid var(--c-line);
}
.sec-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;margin-bottom:12px}
.sec-title svg{flex:none}
.today-item{
  display:flex;align-items:center;gap:10px;background:#FFF9F0;
  border:2px solid #FFE3C2;border-radius:14px;padding:10px 12px;margin-bottom:8px;
}
.today-item.overdue{border-color:#F8B4B6;background:#FFF5F5}
.today-item .ch{
  width:44px;height:44px;flex:none;border-radius:12px;background:var(--c-sun);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:800;color:#7A4A00;
}
.today-item.overdue .ch{background:#F9C7C9;color:#A12226}
.today-item .info{flex:1;min-width:0}
.today-item .info .nm{font-size:15px;font-weight:700}
.today-item .info .st{font-size:12.5px;color:#8A8578;margin-top:2px}
.today-item .do{
  flex:none;min-width:74px;min-height:44px;border-radius:12px;font-weight:700;font-size:14px;
  background:var(--c-main);color:#fff;padding:0 12px;
}
.today-item.overdue .do{background:var(--c-red)}
.today-empty{color:#B8B2A6;font-size:14px;text-align:center;padding:8px 0}
.today-stats{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.today-stats .pill{
  background:#FFF2DF;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:#B45A14;
}
/* ===== 模块卡片 & Tab ===== */
.card{background:var(--c-card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 16px;margin-bottom:16px;border:2px solid var(--c-line)}
.module-tabs{display:flex;gap:8px;margin-bottom:16px}
.module-tabs button{
  flex:1;min-height:50px;border-radius:16px;font-weight:800;font-size:15px;
  background:var(--c-card);color:#8A8578;border:2px solid var(--c-line);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.module-tabs button svg{flex:none}
.module-tabs button.on{background:var(--c-main);color:#fff;border-color:var(--c-main)}
/* ===== 识字卡片 ===== */
.word-cards{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:560px){.word-cards{grid-template-columns:1fr 1fr}}
.wcard{position:relative;min-height:180px;border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg,#FFF9F0,#FFF1DC);border:2px solid var(--c-line);
  display:flex;flex-direction:column;padding:16px}
.wcard .whead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wcard .widx{font-size:13px;font-weight:700;color:#C9A063;background:#FFF3D6;border-radius:999px;padding:4px 12px}
.wcard .wstate{font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:999px}
.wstate.learned{background:#DFF2E7;color:#2E8B5C}
.wstate.todo{background:#FFF3D6;color:#C07F00}
.wcard .wmain{display:flex;gap:14px;align-items:center;flex:1}
.wcard .wsvg{
  width:96px;height:96px;flex:none;border-radius:16px;background:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.05);
}
.wcard .wsvg svg{width:84px;height:84px}
.wcard .wtext{flex:1;min-width:0}
.wcard .wchar{font-size:44px;font-weight:900;line-height:1.1;color:#3A2E1E}
.wcard .wpinyin{font-size:17px;color:#C07F00;font-weight:700;margin-top:4px;letter-spacing:2px}
.wcard .wdesc{font-size:13px;color:#8A8578;margin-top:8px;line-height:1.5}
.wcard .wfooter{display:flex;gap:8px;margin-top:14px}
.wcard .wfooter .btn-learn{
  flex:1;min-height:50px;border-radius:14px;font-size:15px;font-weight:800;
  background:var(--c-main);color:#fff;
}
.wcard .wfooter .btn-learn.done{background:#DFF2E7;color:#2E8B5C}
.wcard .wfooter .btn-flip{
  flex:none;min-width:56px;min-height:50px;border-radius:14px;font-weight:800;font-size:18px;
  background:#fff;border:2px solid var(--c-line);color:#B45A14;
}
/* 象形图弹出 */
.flip-overlay{
  position:fixed;inset:0;z-index:100;background:rgba(60,40,20,.55);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.flip-card{
  width:100%;max-width:400px;background:#fff;border-radius:24px;padding:24px 20px;
  text-align:center;position:relative;animation:pop .25s ease;
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.flip-card .fc-svg{width:150px;height:150px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:#FFF7EC;border-radius:24px}
.flip-card .fc-svg svg{width:130px;height:130px}
.flip-card .fc-char{font-size:64px;font-weight:900;color:#3A2E1E;line-height:1.1}
.flip-card .fc-py{font-size:20px;color:#C07F00;font-weight:700;letter-spacing:3px;margin:4px 0 8px}
.flip-card .fc-words{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.flip-card .fc-words span{background:#FFF2DF;color:#B45A14;font-weight:700;font-size:16px;border-radius:10px;padding:6px 14px}
.flip-card .fc-desc{font-size:14.5px;color:#6E675A;line-height:1.6;margin-bottom:16px}
.flip-card .fc-got{width:100%;min-height:56px;border-radius:16px;font-size:18px;font-weight:800;background:var(--c-grass);color:#fff}
.flip-card .fc-close{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;background:#F3EEE3;font-size:20px;color:#8A8578}
/* ===== 组词练习 ===== */
.quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.quiz-score{background:#FFF2DF;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:800;color:#B45A14}
.quiz-card{background:#FFF9F0;border:2px solid var(--c-line);border-radius:20px;padding:20px 16px;text-align:center}
.quiz-card .q-char{
  width:110px;height:110px;margin:0 auto 6px;border-radius:24px;background:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
  font-size:64px;font-weight:900;color:#3A2E1E;
}
.quiz-card .q-tip{font-size:16px;font-weight:700;color:#6E675A;margin-bottom:16px}
.quiz-opts{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
@media(min-width:560px){.quiz-opts{grid-template-columns:1fr 1fr}}
.quiz-opts button{
  min-height:56px;border-radius:16px;font-size:18px;font-weight:800;
  background:#fff;border:2px solid var(--c-line);color:#3A2E1E;
}
.quiz-opts button.right{background:#DFF2E7;border-color:#4CAF7D;color:#2E8B5C}
.quiz-opts button.wrong{background:#FDE3E4;border-color:#E5484D;color:#A12226}
.quiz-done{text-align:center;padding:16px 0}
.quiz-done .big{font-size:56px;font-weight:900;color:var(--c-main)}
.quiz-done .sub{font-size:16px;color:#6E675A;margin:8px 0 16px}
/* ===== 闯关积分 ===== */
.levels-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.levels-grid{grid-template-columns:repeat(6,1fr)}}
.level-box{
  border-radius:16px;padding:12px 6px;text-align:center;border:2px solid var(--c-line);
  background:#FFF9F0;position:relative;
}
.level-box.on{border-color:var(--c-main);background:#FFF2DF;box-shadow:0 4px 12px rgba(255,138,61,.2)}
.level-box.done{border-color:#B8E6CD;background:#EDF8F1}
.level-box .lv-no{font-size:13px;font-weight:800;color:#C9A063}
.level-box .lv-stars{display:flex;justify-content:center;gap:2px;margin-top:6px}
.level-box .lv-stars svg{width:18px;height:18px}
.level-box .lv-stars .off{opacity:.25}
.coin-bar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:linear-gradient(135deg,#FFC53D,#FF9A4D);border-radius:16px;
  padding:12px 16px;color:#7A4A00;font-weight:800;font-size:16px;margin-top:14px;
}
.coin-bar .coin{display:flex;align-items:center;gap:8px;font-size:20px}
.coin-bar .coin svg{width:26px;height:26px}
.shop-list{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
@media(min-width:560px){.shop-list{grid-template-columns:1fr 1fr}}
.shop-item{
  border:2px solid var(--c-line);border-radius:18px;padding:14px;background:#FFF9F0;
  display:flex;align-items:center;gap:12px;
}
.shop-item .si-icon{width:52px;height:52px;flex:none;border-radius:14px;background:#FFF2DF;display:flex;align-items:center;justify-content:center}
.shop-item .si-icon svg{width:30px;height:30px}
.shop-item .si-info{flex:1;min-width:0}
.shop-item .si-info .nm{font-size:16px;font-weight:800}
.shop-item .si-info .cost{font-size:13px;color:#C07F00;font-weight:700;margin-top:3px;display:flex;align-items:center;gap:4px}
.shop-item .si-btn{flex:none;min-width:80px;min-height:48px;border-radius:14px;font-weight:800;font-size:14px;background:var(--c-main);color:#fff;padding:0 10px}
.shop-item .si-btn:disabled{background:#E4DFD2;color:#A8A295}
.shop-item .si-btn.doing{background:#4CAF7D}
.shop-item .si-btn.done{background:#DFF2E7;color:#2E8B5C}
.shop-item .si-btn.wait{background:#FFC53D;color:#7A4A00}
/* ===== 家长面板 ===== */
.pa-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.pa-tabs button{
  min-height:46px;border-radius:14px;padding:0 16px;font-weight:700;font-size:14px;
  background:var(--c-card);border:2px solid var(--c-line);color:#6E675A;
}
.pa-tabs button.on{background:var(--c-main);border-color:var(--c-main);color:#fff}
.pa-block{background:var(--c-card);border:2px solid var(--c-line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.pa-block h4{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.pa-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pa-row label{font-size:14px;font-weight:600;min-width:76px}
.pa-row input,.pa-row select{
  flex:1;min-width:160px;min-height:46px;border-radius:12px;border:2px solid var(--c-line);
  padding:0 12px;background:#FFFDF8;
}
.pa-row .add-btn{min-height:46px;border-radius:12px;background:var(--c-main);color:#fff;font-weight:700;padding:0 18px}
.req-item{
  border:2px solid var(--c-line);border-radius:14px;padding:12px;margin-bottom:10px;
  display:flex;align-items:center;gap:10px;background:#FFF9F0;
}
.req-item .ri-info{flex:1;min-width:0}
.req-item .ri-info .nm{font-size:15px;font-weight:700}
.req-item .ri-info .st{font-size:12.5px;color:#8A8578;margin-top:2px}
.req-item .ri-acts{display:flex;gap:8px;flex:none}
.req-item .ri-acts button{min-height:44px;border-radius:12px;padding:0 14px;font-weight:700;font-size:13.5px}
.req-item .ok{background:#DFF2E7;color:#2E8B5C}
.req-item .no{background:#FDE3E4;color:#A12226}
.bk-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bk-actions button{min-height:52px;border-radius:14px;font-weight:800;font-size:15px;color:#fff}
.bk-actions .ex{background:var(--c-sky)}
.bk-actions .im{background:var(--c-grape)}
.danger-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.danger-actions button{min-height:48px;border-radius:14px;font-weight:700;font-size:14px;border:2px solid #F8B4B6;background:#fff;color:#A12226}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats-grid .st-box{background:#FFF9F0;border:2px solid var(--c-line);border-radius:16px;padding:12px;text-align:center}
.stats-grid .st-box .num{font-size:28px;font-weight:900;color:var(--c-main)}
.stats-grid .st-box .lb{font-size:12.5px;color:#8A8578;margin-top:2px}
/* ===== 密码弹窗 ===== */
.pwd-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(60,40,20,.6);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.pwd-card{width:100%;max-width:360px;background:#fff;border-radius:24px;padding:26px 22px;text-align:center;animation:pop .25s ease}
.pwd-card h3{font-size:19px;font-weight:800;margin-bottom:6px}
.pwd-card .sub{font-size:13.5px;color:#8A8578;margin-bottom:18px}
.pwd-inputs{display:flex;justify-content:center;gap:12px;margin-bottom:20px}
.pwd-inputs .dot{
  width:54px;height:60px;border-radius:14px;border:2px solid var(--c-line);background:#FFFDF8;
  display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--c-main);
}
.pwd-inputs .dot.filled{border-color:var(--c-main);background:#FFF2DF}
.pwd-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.pwd-keypad button{min-height:56px;border-radius:14px;font-size:22px;font-weight:800;background:#FFF9F0;border:2px solid var(--c-line)}
.pwd-keypad button:active{background:var(--c-line)}
.pwd-card .pwd-err{color:var(--c-red);font-size:13.5px;min-height:20px;margin-bottom:8px}
/* ===== 底部导航 ===== */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:#fff;border-top:2px solid var(--c-line);
  display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 16px rgba(0,0,0,.06);
}
.bottom-nav button{
  flex:1;min-height:56px;border-radius:14px;background:transparent;color:#A8A295;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;
}
.bottom-nav button svg{width:24px;height:24px}
.bottom-nav button.on{background:#FFF2DF;color:var(--c-main-d)}
/* ===== 通用 ===== */
.hidden{display:none!important}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:300;
  background:rgba(50,40,20,.92);color:#fff;padding:12px 22px;border-radius:999px;
  font-size:15px;font-weight:600;animation:pop .2s ease;max-width:86%;text-align:center;
}
.confirm-overlay{
  position:fixed;inset:0;z-index:250;background:rgba(60,40,20,.55);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.confirm-card{width:100%;max-width:340px;background:#fff;border-radius:22px;padding:22px;text-align:center;animation:pop .25s ease}
.confirm-card .msg{font-size:16px;font-weight:700;line-height:1.6;margin-bottom:16px}
.confirm-card .acts{display:flex;gap:10px}
.confirm-card .acts button{flex:1;min-height:50px;border-radius:14px;font-weight:800;font-size:15px}
.confirm-card .no{background:#F3EEE3;color:#6E675A}
.confirm-card .yes{background:var(--c-red);color:#fff}
.empty-tip{text-align:center;color:#B8B2A6;font-size:14px;padding:20px 0}
/* ===== 绘本馆 ===== */
.bk-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:420px){.bk-row{grid-template-columns:1fr}}
.book-item{position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--c-line);background:#fff;text-align:left;padding:0;display:flex;flex-direction:column}
.book-item .bk-cover{position:relative;aspect-ratio:3/2;background:linear-gradient(160deg,#FFF9F0,#FFEFD9)}
.book-item .bk-cover svg{width:100%;height:100%;display:block}
.book-item .bk-cover .bk-badge{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.94);border-radius:999px;font-size:11.5px;font-weight:800;color:#B45A14;padding:4px 10px;z-index:2}
.book-item .bk-cover .bk-new{position:absolute;top:8px;right:8px;background:#FF6B6B;color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:3px 9px;z-index:2}
.book-item .bk-info{padding:10px 12px 12px;flex:1}
.book-item .bk-info .nm{font-size:15.5px;font-weight:800}
.book-item .bk-info .sub{font-size:12px;color:#8A8578;margin-top:4px;display:flex;gap:8px;align-items:center}
.book-item .bk-info .sub .mini-done{color:#2E8B5C;font-weight:700}
.book-item .bk-info .bk-open{margin-top:8px;width:100%;min-height:44px;border-radius:12px;background:var(--c-main);color:#fff;font-weight:800;font-size:14.5px}
.book-item .bk-info .bk-open.done{background:#DFF2E7;color:#2E8B5C}
.book-reco{border:2px dashed #F5C68A;background:linear-gradient(120deg,#FFF9F0,#FFF1DC);border-radius:18px;padding:14px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.book-reco .reco-cover{width:88px;height:88px;flex:none;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.book-reco .reco-cover svg{width:100%;height:100%;display:block}
.book-reco .reco-info{flex:1;min-width:0}
.book-reco .reco-tag{font-size:11.5px;font-weight:800;color:#C07F00;background:#FFF3D6;border-radius:999px;padding:3px 10px;display:inline-block}
.book-reco .reco-name{font-size:17px;font-weight:800;margin-top:5px}
.book-reco .reco-tip{font-size:12.5px;color:#8A8578;margin-top:3px;line-height:1.5}
.book-reco .reco-btn{flex:none;min-width:88px;min-height:52px;border-radius:14px;background:var(--c-main);color:#fff;font-weight:800;font-size:15px}
/* 阅读器 */
.reader{position:fixed;inset:0;z-index:200;background:#FFF7EC;display:flex;flex-direction:column}
.reader-top{display:flex;align-items:center;gap:8px;padding:10px 12px calc(8px + env(safe-area-inset-top));background:#fff;border-bottom:2px solid var(--c-line)}
.reader-top .rt-title{flex:1;min-width:0;font-weight:800;font-size:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-top .rt-close{flex:none;min-width:48px;min-height:48px;border-radius:14px;background:#F3EEE3;color:#6E675A;font-size:15px;font-weight:700}
.reader-top .rt-auto{flex:none;min-height:48px;border-radius:14px;background:#FFF2DF;color:#C07F00;font-size:13px;font-weight:800;padding:0 12px}
.reader-top .rt-auto.on{background:#DFF2E7;color:#2E8B5C}
.reader-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 12px;min-height:0}
.reader-scene{position:relative;width:100%;max-width:560px;aspect-ratio:3/2;border-radius:24px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.14);transition:opacity .22s ease,transform .22s ease}
.reader-scene.fade{opacity:0;transform:scale(.985)}
.reader-scene .scene-svg{position:absolute;inset:0}
.reader-scene .scene-svg svg{width:100%;height:100%;display:block}
.tap-el{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:transparent;border:none;cursor:pointer}
.tap-el .bubble{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--c-main);color:var(--c-main-d);font-size:20px;font-weight:900;border-radius:999px;padding:6px 16px;white-space:nowrap;opacity:0;box-shadow:0 4px 14px rgba(0,0,0,.16);pointer-events:none;z-index:3}
.tap-el.show .bubble{opacity:1}
.tap-el .ring{position:absolute;inset:-4px;border-radius:50%;border:4px solid rgba(255,255,255,.9);opacity:0;pointer-events:none}
.tap-el.pop .ring{animation:popRing .55s ease}
.tap-el.pop .bubble{animation:pop .3s ease}
@keyframes popRing{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.9);opacity:0}}
.reader-txt{display:flex;align-items:center;gap:10px;padding:2px 16px 10px;justify-content:center}
.reader-txt .rt-word{font-size:26px;font-weight:900;color:#3A2E1E;line-height:1.4;text-align:center}
.reader-txt .rt-speak{flex:none;min-width:56px;min-height:56px;border-radius:16px;background:var(--c-main);color:#fff}
.reader-nav{display:flex;gap:12px;padding:0 16px calc(14px + env(safe-area-inset-bottom))}
.reader-nav button{flex:1;min-height:60px;border-radius:18px;font-size:18px;font-weight:800}
.reader-nav .prev{background:#F3EEE3;color:#6E675A}
.reader-nav .prev:disabled{background:#F3EEE3;color:#C8C2B4}
.reader-nav .next{background:var(--c-main);color:#fff}
.reader-nav .next:disabled{background:#E4DFD2;color:#A8A295}
.reader-nav .next.done-btn{background:#4CAF7D}
/* 完成页 */
.book-done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,247,236,.97);border-radius:24px;z-index:5;text-align:center;padding:20px}
.book-done .bd-star{width:96px;height:96px;animation:spinStar .8s ease}
@keyframes spinStar{0%{transform:scale(0) rotate(-200deg)}60%{transform:scale(1.25) rotate(12deg)}100%{transform:scale(1) rotate(0)}}
.book-done .bd-t1{font-size:26px;font-weight:900;color:#B45A14;margin-top:14px}
.book-done .bd-t2{font-size:15px;color:#8A8578;margin-top:8px;line-height:1.6}
.book-done .bd-coins{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:#FFF3D6;border-radius:999px;padding:6px 16px;font-size:15px;font-weight:800;color:#C07F00}
.book-done button{min-width:150px;min-height:56px;border-radius:16px;background:var(--c-main);color:#fff;font-size:17px;font-weight:800;margin-top:18px}
/* 家长：绘本管理 */
.album-thumb{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--c-line);margin-bottom:10px}
.album-thumb img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover}
.upload-drop{border:2px dashed #F5C68A;border-radius:16px;padding:22px 14px;text-align:center;color:#8A8578;font-size:13.5px;background:#FFFDF8;margin-bottom:12px}
.upload-drop b{color:#B45A14}
</style>
</head>

  return '<rect width="300" height="220" rx="24" fill="#FFF3D6"/>';
}
function pbSpr(id,x,y,s){return '<g transform="translate('+x+' '+y+') scale('+(s||1)+')">'+PBE[id]+'</g>'}
function pbSvg(pg){
  var bg=(pg.scene==='col')?('<rect width="300" height="220" rx="24" fill="'+pg.bg+'"/>'):pbScene(pg.scene);

}

function esc(s){return String(s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayCN(){var d=new Date(),w=['日','一','二','三','四','五','六'];return (d.getMonth()+1)+'月'+d.getDate()+'日 · 星期'+w[d.getDay()]}
function starSVG(on){return on
  ?'<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 16.9 6.1 20l1.2-6.5L2.5 8.9l6.6-.9z" fill="#FFC53D"/></svg>'
  :'<svg viewBox="0 0 24 24" class="off"><path d="M12 2l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 16.9 6.1 20l1.2-6.5L2.5 8.9l6.6-.9z" fill="#E4DFD2"/></svg>'}
function coinSVG(){return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFC53D" stroke="#D98E04" stroke-width="2"/><circle cx="12" cy="12" r="5.5" stroke="#D98E04" stroke-width="2" fill="none"/><text x="12" y="15.8" text-anchor="middle" font-size="8" font-weight="900" fill="#7A4A00">¥</text></svg>'}

/* ============ 数据 ============ */
var K = {prog:'wb_shizi_progress', pwd:'wb_shizi_pwd', shop:'wb_shizi_shop', req:'wb_shizi_reqs', pwdSet:'wb_shizi_pwdset', reads:'wb_shizi_reads', custom:'wb_shizi_custom'};
function load(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}

/* 进度：{date, learned:{字:日期}, coins, levelStars:[], pendingChars:[]} */
var state = {
  mode:'kid',
  tab:'word',
  quiz:{q:null,answered:false,right:0,total:0},
  learnedSet:null
};
function getProg(){return load(K.prog,{date:today(),learned:{},coins:8,levelStars:{},pendingChars:[]})}
function putProg(p){save(K.prog,p)}
function getShop(){return load(K.shop,[
  {id:1,name:'看动画片 15 分钟',cost:10,icon:'tv',on:1},
  {id:2,name:'去公园玩一次',cost:30,icon:'park',on:1},
  {id:3,name:'买一张小贴纸',cost:20,icon:'sticker',on:1}
])}

function getReqs(){return load(K.req,[])}
function putReqs(r){save(K.req,r)}
function getPwd(){return localStorage.getItem(K.pwd)||''}
function hasPwd(){return localStorage.getItem(K.pwdSet)==='1'}

/* 计算今天的任务：当前关卡中未学会的字，若前一关未完成则顺延 */
function curLevel(){
  var p=getProg();
  for(var i=0;i<LV;i++){
    var ws=WORDS.slice(i*5,i*5+5);
    var left=ws.filter(function(w){return !p.learned[w.c]});
    if(left.length>0) return {lv:i, left:left, total:ws};
  }
  return {lv:LV-1, left:[], total:WORDS.slice((LV-1)*5)};
}
function todayTasks(){
  var p=getProg(), cl=curLevel();
  /* 判断是否有"昨天没学完"：学习日期不是今天且当前关卡有未学完 */
  var lastLearnDate=p.date||today();
  var hasOverdue = cl.left.length>0 && lastLearnDate!==today();
  return {cl:cl, hasOverdue:hasOverdue, overdueChars:hasOverdue?cl.left:[]};
}
function learnedSet(){
  if(state.learnedSet) return state.learnedSet;
  var p=getProg(); state.learnedSet={};
  Object.keys(p.learned).forEach(function(c){state.learnedSet[c]=1});
  return state.learnedSet;
}

/* ============ 提示 ============ */
var toastTimer=null;
function toast(msg){
  var t=document.querySelector('.toast');
  if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.opacity='0'},2200);
}
function confirmDlg(msg,cb){
  var o=document.createElement('div');o.className='confirm-overlay';
  o.innerHTML='<div class="confirm-card"><div class="msg">'+esc(msg)+'</div><div class="acts"><button class="no">再想想</button><button class="yes">确定</button></div></div>';
  o.querySelector('.no').onclick=function(){o.remove()};
  o.querySelector('.yes').onclick=function(){o.remove();cb()};
  document.body.appendChild(o);
}
function celebrate(){}

/* ============ 渲染：今天要处理 ============ */
function renderToday(){
  var t=todayTasks(), p=getProg(), box=$('todayList'), stats=$('todayStats');
  var html='';
  if(t.overdueChars.length>0){
    html+='<div class="today-item overdue">'+
      '<div class="ch">!</div>'+
      '<div class="info"><div class="nm">昨天的字还没学完</div><div class="st">已自动顺延到今天：'+t.overdueChars.map(function(w){return w.c}).join('、')+'</div></div>'+
      '<button class="do" onclick="goLearn()">去学习</button></div>';
  }
  t.cl.left.slice(0,5).forEach(function(w){
    html+='<div class="today-item">'+
      '<div class="ch">'+esc(w.c)+'</div>'+
      '<div class="info"><div class="nm">'+esc(w.p)+' · '+esc(w.w[0])+'</div><div class="st">'+esc(w.d)+'</div></div>'+
      '<button class="do" onclick="goLearn()">学它</button></div>';
  });
  if(!t.cl.left.length){
    html='<div class="today-empty">今天的字都学完啦！你真棒！</div>';
  }
  /* 绘本提醒：今天还没读绘本时显示 */
  if(bookTodayN()===0){
    html+='<div class="today-item" style="border-color:#BFE6C9;background:#F4FBF5">'+
      '<div class="ch" style="background:#BFE6C9;color:#2E7D45">绘</div>'+
      '<div class="info"><div class="nm">今天还没读绘本</div><div class="st">点一点会发声，和宝宝读 3 分钟吧</div></div>'+
      '<button class="do" style="background:#4CAF7D" onclick="goBook()">去读</button></div>';
  }
  box.innerHTML=html;
  /* 统计 */
  var learnedCount=Object.keys(p.learned).length;
  var levelDone=Object.keys(p.levelStars||{}).filter(function(k){return p.levelStars[k]>=1}).length;
  stats.innerHTML=
    '<span class="pill">已认识 '+learnedCount+' 个字</span>'+
    '<span class="pill">金币 '+p.coins+' 枚</span>'+
    '<span class="pill">通关 '+levelDone+'/'+LV+' 关</span>';
}
function goLearn(){switchTab('word');setTimeout(function(){var el=document.querySelector('.wcard .btn-learn:not(.done)');if(el){el.scrollIntoView({behavior:'smooth',block:'center'})}},80)}

/* ============ 渲染：识字卡片 ============ */
function renderWord(){
  var t=todayTasks(), ls=learnedSet(), box=$('wordList'), done=$('wordAllDone');
  var chars=t.cl.left.slice(0,5);
  var html='';
  chars.forEach(function(w,idx){
    var learned=!!ls[w.c];
    html+='<div class="wcard">'+
      '<div class="whead"><span class="widx">第 '+(idx+1)+' 个字</span>'+
      '<span class="wstate '+(learned?'learned':'todo')+'">'+(learned?'已学会':'今天要学')+'</span></div>'+
      '<div class="wmain">'+
        '<div class="wsvg">'+SV[w.s]+'</div>'+
        '<div class="wtext"><div class="wchar">'+esc(w.c)+'</div><div class="wpinyin">'+esc(w.p)+'</div><div class="wdesc">'+esc(w.d)+'</div></div>'+
      '</div>'+
      '<div class="wfooter">'+
        '<button class="btn-flip" onclick="showFlip('+idx+')">看看</button>'+
        '<button class="btn-learn'+(learned?' done':'')+'" onclick="learnWord('+idx+')">'+(learned?'已学会':'我学会啦 +2金币')+'</button>'+
      '</div></div>';
  });
  if(!chars.length){
    html='<div class="empty-tip">本关全部学会啦！<br>去「闯关积分」看看下一关吧～</div>';
  }
  box.innerHTML=html;
  done.innerHTML='';
  if(!chars.length && t.cl.total.every(function(w){return ls[w.c]})){
    done.innerHTML='<div class="empty-tip" style="color:#2E8B5C;font-weight:700">本关全部学会！获得 星星奖励</div>';
  }
}
var flipIdx=null;
function showFlip(i){
  var t=todayTasks(), w=t.cl.left[i];
  if(!w){toast('这个字已经学完啦');return}
  flipIdx=i;
  var o=document.createElement('div');o.className='flip-overlay';o.id='flipOv';
  o.innerHTML='<div class="flip-card">'+
    '<button class="fc-close" onclick="closeFlip()">×</button>'+
    '<div class="fc-svg">'+SV[w.s]+'</div>'+
    '<div class="fc-char">'+esc(w.c)+'</div>'+
    '<div class="fc-py">'+esc(w.p)+'</div>'+
    '<div class="fc-words">'+w.w.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>'+
    '<div class="fc-desc">'+esc(w.d)+'</div>'+
    '<button class="fc-got" onclick="learnWord('+i+');closeFlip()">我认识啦！+2 金币</button></div>';
  document.body.appendChild(o);
}
function closeFlip(){var o=$('flipOv');if(o)o.remove();flipIdx=null}
function learnWord(i){
  var t=todayTasks(), w=t.cl.left[i];
  if(!w){toast('这个字已经学完啦');return}
  var p=getProg();
  if(p.learned[w.c]){toast('已经学会啦，复习一下！');renderAll();return}
  p.learned[w.c]=today();
  p.coins=(p.coins||0)+2;
  p.date=today();
  /* 关卡星星：本关学完给1星 */
  var lv=t.cl.lv;
  if(t.cl.total.every(function(x){return p.learned[x.c]})){
    if(!p.levelStars[lv]||p.levelStars[lv]<1)p.levelStars[lv]=1;
    p.coins+=3; /* 通关奖励 */
    toast('第'+(lv+1)+'关通关！奖励 3 金币');
  }
  state.learnedSet=null;
  putProg(p);
  renderAll();
}
/* ============ 渲染：组词练习 ============ */
function renderQuiz(){
  var box=$('quizBox'), p=getProg(), ls=learnedSet();
  var learnedChars=WORDS.filter(function(w){return ls[w.c]});
  if(!learnedChars.length){
    box.innerHTML='<div class="empty-tip">先学几个字，再来组词练习吧！<br>去「识字卡片」认一认～</div>';
    return;
  }
    if(!state.quiz.q){
    /* 出题：随机抽已学字，4 选 1 组词 */
    var qw=learnedChars[Math.floor(Math.random()*learnedChars.length)];
    var wrongs=WORDS.filter(function(w){return w.c!==qw.c&&w.w[0]!==qw.w[0]});
    /* 打乱 */
    wrongs.sort(function(){return Math.random()-.5});
    var opts=[qw.w[0]];
    var used=[qw.w[0]];
    for(var i=0;i<wrongs.length&&opts.length<4;i++){
      var cand=wrongs[i].w[Math.floor(Math.random()*wrongs[i].w.length)];
      if(used.indexOf(cand)<0){opts.push(cand);used.push(cand)}
    }
    opts.sort(function(){return Math.random()-.5});
    state.quiz.q=qw;state.quiz.opts=opts;state.quiz.answered=false;state.quiz.last=null;
  }
  var q=state.quiz;
  var html='<div class="quiz-head">'+
    '<span class="quiz-score">本局答对 '+q.right+'/'+q.total+'</span>'+
    '<span class="quiz-score" style="background:#EDF3FB;color:#2E6DA4">共认识 '+learnedChars.length+' 字</span></div>';
  html+='<div class="quiz-card">'+
    '<div class="q-char">'+esc(q.q.c)+'</div>'+
    '<div class="q-tip">"'+esc(q.q.c)+'" 可以组成哪个词？</div>';
  html+='<div class="quiz-opts">';
  q.opts.forEach(function(op,oi){
    var cls='';
    if(q.answered){
      if(op===q.q.w[0])cls=' right';
      else if(op===q.last)cls=' wrong';
    }
    html+='<button class="'+cls+'" onclick="answerQuiz('+oi+')">'+esc(op)+'</button>';
  });
  html+='</div></div>';
  box.innerHTML=html;
}
function answerQuiz(oi){
  var q=state.quiz;
  if(q.answered)return;
  q.answered=true;q.last=q.opts[oi];q.total++;
  var p=getProg();
  if(q.opts[oi]===q.q.w[0]){
    q.right++;p.coins=(p.coins||0)+1;putProg(p);
    toast('太棒了！+1金币');
  }else{
    toast('再想想～正确答案是「'+q.q.w[0]+'」');
  }
  renderQuiz();refreshCoins();
  /* 2 秒后下一题 */
  setTimeout(function(){
    if(state.quiz&&state.quiz.answered){
      state.quiz.q=null;
      renderQuiz();
    }
  },1800);
}
/* ============ 渲染：闯关积分 ============ */
function renderLevel(){
  var p=getProg(), grid=$('levelGrid'), shop=$('shopList');
  var cl=curLevel();
  var html='';
  for(var i=0;i<LV;i++){
    var ws=WORDS.slice(i*5,i*5+5);
    var doneCount=ws.filter(function(w){return p.learned[w.c]}).length;
    var stars=p.levelStars[i]||0;
    var doneCls=doneCount===5?' done':'';
    var onCls=(i===cl.lv&&doneCount<5)?' on':'';
    html+='<div class="level-box'+doneCls+onCls+'">'+
      '<div class="lv-no">第'+(i+1)+'关</div>'+
      '<div class="lv-stars">'+starSVG(stars>=1)+starSVG(stars>=2)+starSVG(stars>=3)+'</div>'+
      '<div style="font-size:12px;color:#B8B2A6;margin-top:4px">'+doneCount+'/5</div></div>';
  }
  grid.innerHTML=html;
  $('coinNum').textContent=p.coins||0;
  /* 小卖部 */
  var shopItems=getShop();
  var reqs=getReqs();
  var sh='';
  var icons={tv:'<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="3" stroke="#9B6DE3" stroke-width="2"/><path d="M8 3l4 3 4-3M12 19v2" stroke="#9B6DE3" stroke-width="2" stroke-linecap="round"/></svg>',
    park:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" stroke="#4CAF7D" stroke-width="2"/><path d="M8 21v-6h8v6M6 21h12" stroke="#4CAF7D" stroke-width="2" stroke-linecap="round"/></svg>',
    sticker:'<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4" stroke="#FF8A3D" stroke-width="2"/><path d="M9 9h.01M15 9h.01M9 15h6" stroke="#FF8A3D" stroke-width="2.4" stroke-linecap="round"/></svg>',
    gift:'<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="9" width="16" height="11" rx="2" stroke="#E5484D" stroke-width="2"/><path d="M4 13h16M12 9v11" stroke="#E5484D" stroke-width="2"/><path d="M12 9c-3 0-5-1-5-3s2-3 4-2c1 1 1 5 1 5zM12 9c3 0 5-1 5-3s-2-3-4-2c-1 1-1 5-1 5z" fill="#FFC53D"/></svg>'};
  shopItems.forEach(function(it){
    if(!it.on)return;
    var hasReq=reqs.some(function(r){return r.itemId===it.id&&r.status==='pending'});
    var btn;
    if(hasReq){btn='<button class="si-btn wait" disabled>等待家长</button>'}
    else if(p.coins>=it.cost){btn='<button class="si-btn" onclick="askExchange('+it.id+')">兑换</button>'}
    else{btn='<button class="si-btn" disabled style="background:#E4DFD2;color:#A8A295">金币不够</button>'}
    sh+='<div class="shop-item">'+
      '<div class="si-icon">'+(icons[it.icon]||icons.gift)+'</div>'+
      '<div class="si-info"><div class="nm">'+esc(it.name)+'</div>'+
      '<div class="cost">'+coinSVG()+' '+it.cost+' 金币</div></div>'+btn+'</div>';
  });
  if(!shopItems.some(function(x){return x.on}))sh='<div class="empty-tip">家长还没有设置奖励哦</div>';
  shop.innerHTML=sh;
}
function askExchange(id){
  var p=getProg(), s=getShop(), it=s.find(function(x){return x.id===id});
  if(!it)return;
  if(p.coins<it.cost){toast('金币还不够，继续加油！');return}
  confirmDlg('要用 '+it.cost+' 金币兑换「'+it.name+'」吗？',function(){
    var reqs=getReqs();
    reqs.push({id:Date.now(),itemId:id,name:it.name,cost:it.cost,date:today(),status:'pending'});
    putReqs(reqs);
    toast('已告诉家长啦，等家长确认～');
    renderLevel();
  });
}
function refreshCoins(){var p=getProg();$('coinNum').textContent=p.coins||0}

function goBook(){switchTab('book');setTimeout(function(){var el=document.querySelector('#modBook');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},80)}

function openBook(b){
  bk={id:b.id,title:b.title,img:null,pages:b.pages.map(function(p){return {txt:p.txt,svg:pbSvg(p),tap:p.tap||[]}}),page:0,done:false,autoSpeed:0,timer:null};

}
function openCustom(c){
  var pages=c.imgs.map(function(src){
    return {txt:c.title+' 的照片，真好看！',svg:'',tap:[],img:src};
  });
  bk={id:c.id,title:c.title,img:c.imgs[0],pages:pages,page:0,done:false,autoSpeed:0,timer:null};

function buildReader(){
  if(document.getElementById('reader'))document.getElementById('reader').remove();
  var o=document.createElement('div');o.className='reader';o.id='reader';
  o.innerHTML='<div class="reader-top">'+
    '<button class="rt-close" onclick="closeBook()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#6E675A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'+
    '<div class="rt-title">'+esc(bk.title)+'</div>'+
    '<button class="rt-auto" id="rtAuto" onclick="toggleAuto()">自动</button></div>'+
    '<div class="reader-stage"><div class="reader-scene" id="rdScene"></div></div>'+
    '<div class="reader-txt"><div class="rt-word" id="rdWord"></div>'+
    '<button class="rt-speak" onclick="speakNow()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 10v4h4l5 4V6l-5 4H5z" fill="#fff"/><path d="M16 9.5a4.5 4.5 0 010 5M18 7a8 8 0 010 10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button></div>'+
    '<div class="reader-nav"><button class="prev" id="rdPrev" onclick="prevPage()">上一页</button>'+
    '<button class="next" id="rdNext" onclick="nextPage()">下一页</button></div>';
  document.body.appendChild(o);
  stopAuto();
  renderReader();
}
function renderReader(){
  if(!bk)return;
  var pg=bk.pages[bk.page], scene=$('rdScene');
  scene.classList.add('fade');
  setTimeout(function(){
    if(!bk)return;
    scene.classList.remove('fade');

/* ===== 柔和朗读：优选自然女声 + 放慢 + 分段停顿 ===== */
var _softVoice=null;
function pickSoftVoice(){
  var vs=window.speechSynthesis&&speechSynthesis.getVoices?speechSynthesis.getVoices():[];
  var zh=vs.filter(function(v){return v.lang&&String(v.lang).toLowerCase().indexOf('zh')===0});
  if(!zh.length)return null;
  function score(v){
    var n=String(v.name||'').toLowerCase();
    if(/xiaoxiao|yaoyao|xiaoyi|yunjian|yunyang|yunxi|yunxia|晓晓|瑶瑶/.test(n))return 5;
    if(/online|natural|神经/.test(n))return 4;
    if(/google/.test(n))return 3;
    if(/huihui|kangkang|tingting|meijia/.test(n))return 2;
    return 1;
  }
  zh.sort(function(a,b){return score(b)-score(a)});
  return zh[0];
}
var _spQueue=[],_spTimer=null;
function speak(text){
  try{
    if(!('speechSynthesis' in window)){toast('本设备不支持朗读');return}
    if(!_softVoice)_softVoice=pickSoftVoice();
    if(!_softVoice&&speechSynthesis.addEventListener){
      speechSynthesis.addEventListener('voiceschanged',function(){_softVoice=pickSoftVoice()},{once:true});
    }
    speechSynthesis.cancel();
    if(_spTimer){clearTimeout(_spTimer);_spTimer=null}
    _spQueue=[];
    var s=String(text).replace(/\s+/g,' ').trim();
    if(!s)return;
    var parts=s.split(/[。！？；，、…\n]+/).map(function(x){return x.trim()}).filter(function(x){return x});
    if(parts.length<=1){_speakOne(s);return}
    _spQueue=parts;
    _speakNext();
  }catch(e){}
}
function _speakOne(t){
  var u=new SpeechSynthesisUtterance(t);
  u.lang='zh-CN';
  if(_softVoice&&String(_softVoice.lang||'').toLowerCase().indexOf('zh')===0)u.voice=_softVoice;
  u.rate=0.82;u.pitch=1.05;
  u.onend=function(){
    if(_spQueue.length){_spTimer=setTimeout(function(){_speakNext()},180)}
  };
  speechSynthesis.speak(u);
}
function _speakNext(){
  if(!_spQueue.length){_spTimer=null;return}
  _speakOne(_spQueue.shift());
}

        var img=new Image();
        img.onload=function(){

          imgs[i]=cv.toDataURL('image/jpeg',0.82);
          if(++read===files.length)saveAlbum(title,imgs);
        };
        img.src=rd.result;
      };
      rd.readAsDataURL(f);
    });
  };

      if(n==='')return '<button style="visibility:hidden"></button>';
      if(n==='⌫')return '<button onclick="pwdKey(-1)">⌫</button>';
      return '<button onclick="pwdKey('+n+')">'+n+'</button>';
    }).join('')+'</div>'+
    '<button class="fc-close" style="position:static;width:100%;height:48px;border-radius:14px;background:#F3EEE3;font-size:15px;color:#6E675A;margin-top:4px" onclick="closePwd()">取消</button></div>';
  document.body.appendChild(o);
  o._cb=cb;o._isSet=isSet;
}
function pwdKey(n){
  var o=$('pwdOv');if(!o)return;
  if(n===-1){pwdBuf=pwdBuf.slice(0,-1)}
  else if(pwdBuf.length<4){pwdBuf+=n}
  var dots=o.querySelectorAll('.pwd-inputs .dot');
  for(var i=0;i<4;i++){dots[i].classList.toggle('filled',i<pwdBuf.length);dots[i].textContent=pwdBuf[i]||''}
  if(pwdBuf.length===4){
    var err=o.querySelector('#pwdErr');
    if(o._isSet){o._cb();o.remove();return}
    if(pwdBuf===getPwd()){o._cb();o.remove()}
    else{err.textContent='密码不对，再试一次';pwdBuf='';for(var j=0;j<4;j++){dots[j].classList.remove('filled');dots[j].textContent=''}}
  }
}
function closePwd(){var o=$('pwdOv');if(o)o.remove();pwdBuf=''}
function enterParent(){
  state.mode='parent';
  $('kidView').classList.add('hidden');
  $('parentView').classList.remove('hidden');
  $('bottomNav').classList.add('hidden');
  $('modeKid').classList.remove('on');$('modeKid').classList.add('off');
  $('modeParent').classList.add('on');$('modeParent').classList.remove('off');
  renderParent();
}
function enterKid(){
  state.mode='kid';
  $('parentView').classList.add('hidden');
  $('kidView').classList.remove('hidden');
  $('bottomNav').classList.remove('hidden');
  $('modeParent').classList.remove('on');$('modeParent').classList.add('off');
  $('modeKid').classList.add('on');$('modeKid').classList.remove('off');
  renderAll();
}

/* ============ Tab 切换 ============ */
function switchTab(t){
  state.tab=t;
  ['tabWord','tabQuiz','tabLevel','tabBook'].forEach(function(id){$(id).classList.toggle('on',id==='tab'+t[0].toUpperCase()+t.slice(1))});
  document.querySelectorAll('.bottom-nav button').forEach(function(b){b.classList.toggle('on',b.dataset.goto==='tab'+t[0].toUpperCase()+t.slice(1))});
  $('modWord').classList.toggle('hidden',t!=='word');
  $('modQuiz').classList.toggle('hidden',t!=='quiz');
  $('modLevel').classList.toggle('hidden',t!=='level');
  $('modBook').classList.toggle('hidden',t!=='book');
  if(t==='word')renderWord();
  if(t==='quiz')renderQuiz();
  if(t==='level')renderLevel();
  if(t==='book')renderBook();
}
function renderAll(){
  renderToday();renderWord();renderQuiz();renderLevel();renderBook();refreshCoins();
}

  /* 昨天学了第1关的 日 月，但 山 水 火 没学 → 逾期顺延（示例含逾期） */

  }
  if(!load(K.custom,null)){

  }
}

/* ============ 初始化 ============ */
(function init(){
  $('todayLine').textContent=todayCN();
  if(!localStorage.getItem(K.prog))initDemo();
  /* 事件绑定 */
  $('modeKid').onclick=function(){enterKid()};
  $('modeParent').onclick=function(){openParent()};
  $('tabWord').onclick=function(){switchTab('word')};
  $('tabQuiz').onclick=function(){switchTab('quiz')};
  $('tabLevel').onclick=function(){switchTab('level')};
  $('tabBook').onclick=function(){switchTab('book')};
  document.querySelectorAll('.bottom-nav button').forEach(function(b){
    b.onclick=function(){switchTab(b.dataset.goto.replace('tab','').toLowerCase())};
  });
  document.querySelectorAll('.pa-tabs button').forEach(function(b){
    b.onclick=function(){switchPaTab(b.dataset.pa)};
  });
  renderAll();
})();
</script>
